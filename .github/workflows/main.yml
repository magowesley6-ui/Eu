
name: "ExtNoBrasil PC Virtual - Windows 11"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extnobrasil-pc-virtual
  cancel-in-progress: false

jobs:
  prepare-vm:
    name: Preparar ambiente Windows 11 QEMU
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Exibir informações reais do runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host " ExtNoBrasil PC Virtual [BETA]"
          Write-Host " Criador - ExtNoBrasil (ExT)"
          Write-Host "========================================"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture,
              @{N="RAM_Total_GB";E={[math]::Round($_.TotalVisibleMemorySize / 1MB, 2)}} |
            Format-List

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
              NumberOfLogicalProcessors |
            Format-List

          Get-PSDrive -Name C |
            Select-Object Name,
              @{N="Livre_GB";E={[math]::Round($_.Free / 1GB, 2)}} |
            Format-List

          Write-Host "Os dados acima descrevem o runner, não a VM."

      - name: Verificar espaço disponível
        shell: pwsh
        run: |
          $free = (Get-PSDrive C).Free / 1GB
          Write-Host "Espaço livre: $([math]::Round($free, 2)) GB"

          if ($free -lt 25) {
            throw "Espaço insuficiente para tentar baixar e preparar a ISO."
          }

      - name: Tentar obter URL da ISO oficial da Microsoft
        id: iso
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $page = "https://www.microsoft.com/pt-br/software-download/windows11"

          Write-Host "Consultando a página oficial da Microsoft..."
          $response = Invoke-WebRequest `
            -Uri $page `
            -UseBasicParsing `
            -Headers @{
              "User-Agent" = "Mozilla/5.0"
              "Accept-Language" = "pt-BR,pt;q=0.9,en;q=0.8"
            }

          $html = $response.Content

          # Só aceita candidatos do domínio de download da Microsoft.
          $matches = [regex]::Matches(
            $html,
            '(?i)https://software\.download\.prss\.microsoft\.com/[^"''\s<>\\]+'
          )

          $candidate = $null

          foreach ($match in $matches) {
            $url = [System.Net.WebUtility]::HtmlDecode($match.Value)
            $url = $url -replace '\\u0026', '&' -replace '&amp;', '&'

            if ($url -match '(?i)\.iso([?&]|$)') {
              $candidate = $url
              break
            }
          }

          if (-not $candidate) {
            throw @"
          A página oficial não revelou uma URL direta da ISO nesta consulta.
          A Microsoft pode exigir a seleção da edição e do idioma por um fluxo
          dinâmico. O workflow não usará fontes de terceiros nem inventará URLs.
          Abra a página oficial:
          https://www.microsoft.com/pt-br/software-download/windows11
          "@
          }

          if ($candidate -notmatch '^https://software\.download\.prss\.microsoft\.com/') {
            throw "A URL não passou na validação do domínio."
          }

          "WINDOWS_ISO_URL=$candidate" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "URL oficial candidata encontrada."
          Write-Host "O link pode expirar; será validado no download."

      - name: Instalar QEMU
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Get-Command qemu-img.exe -ErrorAction SilentlyContinue)) {
            choco install qemu -y --no-progress
          }

          $qemuImg = Get-Command qemu-img.exe -ErrorAction SilentlyContinue

          if (-not $qemuImg) {
            $possible = @(
              "C:\Program Files\qemu\qemu-img.exe",
              "C:\Program Files\QEMU\qemu-img.exe"
            )

            foreach ($path in $possible) {
              if (Test-Path $path) {
                $qemuImg = Get-Item $path
                break
              }
            }
          }

          if (-not $qemuImg) {
            throw "Não foi possível localizar qemu-img.exe após a instalação."
          }

          $qemuPath = $qemuImg.Source
          if (-not $qemuPath) {
            $qemuPath = $qemuImg.FullName
          }

          "QEMU_IMG=$qemuPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "QEMU encontrado: $qemuPath"
          & $qemuPath --version

      - name: Baixar e validar a ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11_x64.iso"

          Write-Host "Iniciando download da ISO..."
          try {
            Invoke-WebRequest `
              -Uri $env:WINDOWS_ISO_URL `
              -OutFile $isoPath `
              -UseBasicParsing
          }
          catch {
            throw "Download falhou. O link pode ter expirado ou exigir seleção de idioma. Detalhe: $($_.Exception.Message)"
          }

          if (-not (Test-Path $isoPath)) {
            throw "O arquivo ISO não foi criado."
          }

          $sizeGB = (Get-Item $isoPath).Length / 1GB
          Write-Host "Tamanho recebido: $([math]::Round($sizeGB, 2)) GB"

          if ($sizeGB -lt 1) {
            throw "Arquivo pequeno demais para ser uma ISO completa do Windows 11."
          }

          $signature = Get-FileHash -Path $isoPath -Algorithm SHA256
          Write-Host "SHA256: $($signature.Hash)"

          "WINDOWS_ISO_PATH=$isoPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Criar disco virtual expansível de 80 GB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $diskPath = Join-Path $env:RUNNER_TEMP "ExtNoBrasil_Windows11.qcow2"

          if (Test-Path $diskPath) {
            Remove-Item $diskPath -Force
          }

          & $env:QEMU_IMG create -f qcow2 $diskPath 80G

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao criar o disco virtual."
          }

          & $env:QEMU_IMG info $diskPath

          "WINDOWS_DISK_PATH=$diskPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verificar suporte de virtualização
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "Verificando recursos reportados pelo host..."

          try {
            Get-CimInstance Win32_Processor |
              Select-Object Name, VirtualizationFirmwareEnabled,
                VMMonitorModeExtensions,
                SecondLevelAddressTranslationExtensions |
              Format-List
          }
          catch {
            Write-Host "Não foi possível consultar todas as propriedades."
          }

          Write-Host "Essas informações não garantem que QEMU possa usar aceleração."

      - name: Relatório final
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " ExtNoBrasil PC Virtual [BETA]"
          Write-Host "========================================"
          Write-Host "SO pretendido: Windows 11 x64"
          Write-Host "vCPUs pretendidas: 4"
          Write-Host "RAM pretendida: 4096 MB"
          Write-Host "Disco pretendido: 80 GB expansível"
          Write-Host "Vídeo: não configurado / sem GPU física garantida"
          Write-Host "Acesso remoto: não configurado"
          Write-Host ""
          Write-Host "Este workflow prepara arquivos temporários."
          Write-Host "Ele não instala nem inicia uma VM utilizável."
          Write-Host "O disco e a ISO serão perdidos quando o runner for descartado."
          
