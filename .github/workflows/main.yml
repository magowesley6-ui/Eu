
name: ExtNoBrasil PC Virtual - Garuda KDE + XRDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garuda-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Preparar QEMU e ferramentas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            openssh-client \
            curl \
            procps \
            iproute2

          mkdir -p "$HOME/garuda-vm"

      - name: Baixar imagem QCOW2 do Garuda
        env:
          IMAGE_URL: ${{ secrets.GARUDA_QCOW2_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${IMAGE_URL:-}" ]; then
            echo "::error::Configure o segredo GARUDA_QCOW2_URL com a URL direta da imagem QCOW2."
            exit 1
          fi

          curl --fail --location --retry 3 \
            "$IMAGE_URL" \
            --output "$HOME/garuda-vm/garuda.qcow2"

          qemu-img info "$HOME/garuda-vm/garuda.qcow2"

          FORMAT="$(qemu-img info --output=json \
            "$HOME/garuda-vm/garuda.qcow2" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["format"])')"

          if [ "$FORMAT" != "qcow2" ]; then
            echo "::error::O arquivo baixado não é uma imagem QCOW2."
            exit 1
          fi

      - name: Configurar disco virtual de 80 GB
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/garuda-vm"

          qemu-img resize garuda.qcow2 80G

          echo "Disco virtual configurado para até 80 GB."
          echo "O espaço físico disponível continua limitado pelo runner."

      - name: Verificar recursos disponíveis
        shell: bash
        run: |
          echo "===== ExtNoBrasil PC Virtual ====="
          echo "Sistema convidado: Garuda Linux KDE"
          echo "vCPU configuradas: 4"
          echo "RAM da VM: 4096 MB"
          echo "Disco virtual: 80 GB"
          echo "GPU: adaptador virtual QEMU"
          echo "Aceleração KVM:"
          if [ -e /dev/kvm ]; then
            echo "Dispositivo KVM disponível."
          else
            echo "KVM indisponível; QEMU pode usar emulação por software."
          fi
          free -h
          df -h "$HOME"

      - name: Iniciar Garuda e encaminhar XRDP
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/garuda-vm"

          if [ -e /dev/kvm ]; then
            ACCEL=( -enable-kvm )
          else
            ACCEL=()
          fi

          qemu-system-x86_64 \
            "${ACCEL[@]}" \
            -machine q35 \
            -cpu max \
            -smp 4 \
            -m 4096 \
            -drive file=garuda.qcow2,if=virtio,format=qcow2 \
            -device virtio-vga \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:3389-:3389 \
            -device virtio-net-pci,netdev=net0 \
            -display none \
            -monitor none \
            -serial file:garuda-serial.log \
            -daemonize \
            -pidfile qemu.pid

          echo "VM iniciada. Aguardando o XRDP..."
          for i in $(seq 1 60); do
            if timeout 2 bash -c \
              '</dev/tcp/127.0.0.1/3389' 2>/dev/null; then
              echo "Porta XRDP acessível no host."
              exit 0
            fi
            sleep 5
          done

          echo "::error::XRDP não respondeu. Verifique se está instalado e ativo dentro da imagem Garuda."
          cat garuda-serial.log || true
          exit 1

      - name: Abrir túnel TCP Pinggy
        shell: bash
        run: |
          set -euo pipefail

          echo "Iniciando túnel TCP para a porta XRDP 3389..."
          echo "O endereço público será exibido pelo Pinggy."
          echo "Use no Windows App o host e a porta informados pelo túnel."

          ssh -T -p 443 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -R 0:127.0.0.1:3389 \
            tcp@free.pinggy.io
            
